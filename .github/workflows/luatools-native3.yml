name: LuaTools Native 1.3.3 native.3 Linux parity

on:
  push:
    branches: [ "ci/luatools-native-1.3.3-native3" ]
    paths:
      - 'luatools-native3/**'
      - 'luatools-ui2/**'
      - 'luatools-bundle/**'
      - '.github/workflows/luatools-native3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native3:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout build bundle
        uses: actions/checkout@v4

      - name: Reassemble build kit and apply native.3
        shell: bash
        run: |
          set -euxo pipefail
          cat luatools-bundle/part*.b64 | base64 -d > LuaTools-Native-1.3.3-Realization.tar.gz
          mkdir -p workkit
          tar -xzf LuaTools-Native-1.3.3-Realization.tar.gz -C workkit --strip-components=1

          # Carry forward native.1 functional fixes.
          sed -i "/# 2) Game-tools implementation reconstructed/a (P/'Services'/'GameData').mkdir(parents=True, exist_ok=True)" workkit/scripts/apply_overlay.py
          python - <<'PY'
          from pathlib import Path
          p=Path("workkit/scripts/apply_overlay.py")
          s=p.read_text()
          old="write(sam_service,s)"
          new="""s=s.replace("_coverCache.GetCoverPathOrUrl(game.Id)", '_coverCache.GetLocalPath(game.Id) ?? $"https://cdn.cloudflare.steamstatic.com/steam/apps/{game.Id}/header.jpg"')
          write(sam_service,s)"""
          if old not in s: raise SystemExit("SamService patch anchor missing")
          p.write_text(s.replace(old,new,1))
          PY

          # UI parity first, Linux functional parity last.
          cat luatools-ui2/ui2_append.pyfrag >> workkit/scripts/apply_overlay.py
          cat luatools-native3/native3_append.pyfrag >> workkit/scripts/apply_overlay.py
          python -m py_compile workkit/scripts/apply_overlay.py
          bash -n workkit/scripts/build-appimage.sh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native.3 AppImage
        run: ./workkit/scripts/build-appimage.sh

      - name: Assert Linux-native plugin implementation
        shell: bash
        run: |
          set -euxo pipefail
          SRC=workkit/.work/source/src/LuaToolsGui
          grep -q 'CreateLinuxCdpMarker' "$SRC/Services/PluginInstallerService.cs"
          grep -q 'CreateLinuxAutostart' "$SRC/Services/PluginInstallerService.cs"
          grep -q 'Linux CEF bridge' "$SRC/Services/PluginInstallerService.cs"
          grep -q '\-cef-enable-debugging' "$SRC/Platform/LinuxPlatformService.cs"
          grep -q 'Click="NavigateAdd_Click"' "$SRC/MainWindow.axaml"
          grep -q 'Click="NavigateTools_Click"' "$SRC/MainWindow.axaml"
          grep -q 'Navigate(typeof(GameToolsView))' "$SRC/MainWindow.axaml.cs"

          # These Windows-only install mechanisms must not exist in the Linux plugin service.
          ! grep -q 'cmd.exe' "$SRC/Services/PluginInstallerService.cs"
          ! grep -q 'mklink /j' "$SRC/Services/PluginInstallerService.cs"
          ! grep -q 'CdpMarkerJunctionTarget' "$SRC/Services/PluginInstallerService.cs"
          ! grep -q 'LoaderSlot' "$SRC/Services/PluginInstallerService.cs"

      - name: Smoke-test every navigation button
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick openbox xdotool
          APPIMAGE="$(find workkit/dist -maxdepth 1 -name '*.AppImage' -type f | head -n1)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"

          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          openbox >/tmp/openbox.log 2>&1 &
          WM_PID=$!
          sleep 2

          LUATOOLS_SMOKE_TEST=1 APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" >/tmp/luatools-ui.log 2>&1 &
          APP_PID=$!

          WIN=""
          for i in $(seq 1 35); do
            WIN="$(xdotool search --name '^LuaTools$' 2>/dev/null | head -n1 || true)"
            [ -n "$WIN" ] && break
            sleep 1
          done
          test -n "$WIN"
          xdotool windowactivate --sync "$WIN"
          sleep 3

          import -window "$WIN" workkit/dist/native3-home.png
          test -s workkit/dist/native3-home.png

          # Initial navigation performed by MainWindow.Loaded must expose HomeView.
          TITLE="$(xdotool getwindowname "$WIN")"
          echo "initial-title=$TITLE"
          [[ "$TITLE" == "LuaTools::HomeView" ]]

          click_and_assert_page() {
            name="$1"
            expected="$2"
            y="$3"
            xdotool mousemove --window "$WIN" 105 "$y" click 1
            sleep 2
            kill -0 "$APP_PID"
            TITLE="$(xdotool getwindowname "$WIN")"
            echo "$name-title=$TITLE"
            import -window "$WIN" "workkit/dist/native3-$name.png"
            test -s "workkit/dist/native3-$name.png"
            if [[ "$TITLE" != "LuaTools::$expected" ]]; then
              echo "Navigation '$name' did not route to $expected" >&2
              xdotool getmouselocation --shell || true
              echo "---- LuaTools runtime log ----"
              cat /tmp/luatools-ui.log || true
              exit 1
            fi
          }

          # Actual pointer clicks against each navigation button.
          click_and_assert_page add DownloadView 114
          click_and_assert_page manage ManageView 158
          click_and_assert_page depots BuildsView 202
          click_and_assert_page tools GameToolsView 246
          click_and_assert_page mode ModeView 290
          click_and_assert_page fixes FixesView 334
          click_and_assert_page plugin PluginView 378

          # Bottom navigation.
          click_and_assert_page downloads DownloadsView 474
          click_and_assert_page settings SettingsView 518

          # Return home and capture the final visual artifact.
          xdotool mousemove --window "$WIN" 105 70 click 1
          sleep 2
          [[ "$(xdotool getwindowname "$WIN")" == "LuaTools::HomeView" ]]
          import -window "$WIN" workkit/dist/LuaTools-native.3-smoke.png

          MEAN="$(identify -format '%[fx:mean]' workkit/dist/LuaTools-native.3-smoke.png)"
          python - "$MEAN" <<'PY'
          import sys
          mean=float(sys.argv[1])
          print(f"captured-window-mean={mean:.6f}")
          if mean <= 0.015:
              raise SystemExit("Captured LuaTools window is effectively black")
          PY

          echo "---- LuaTools smoke log ----"
          cat /tmp/luatools-ui.log || true

          kill "$APP_PID" 2>/dev/null || true
          kill "$WM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Rename candidate
        shell: bash
        run: |
          set -euxo pipefail
          OLD="$(find workkit/dist -maxdepth 1 -name '*.AppImage' -type f | head -n1)"
          NEW="workkit/dist/LuaTools-1.3.3-native.3-x86_64.AppImage"
          if [ "$OLD" != "$NEW" ]; then mv "$OLD" "$NEW"; fi
          chmod +x "$NEW"
          sha256sum "$NEW" > "$NEW.sha256"

      - name: Upload native.3
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-1.3.3-native.3-x86_64
          path: |
            workkit/dist/LuaTools-1.3.3-native.3-x86_64.AppImage
            workkit/dist/LuaTools-1.3.3-native.3-x86_64.AppImage.sha256
            workkit/dist/LuaTools-native.3-smoke.png
            workkit/dist/native3-*.png
          if-no-files-found: error
          retention-days: 30
