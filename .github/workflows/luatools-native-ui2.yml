name: LuaTools Native 1.3.3 UI Parity v2

on:
  push:
    branches: [ "ci/luatools-native-1.3.3-ui2" ]
    paths:
      - 'luatools-ui2/**'
      - 'luatools-bundle/**'
      - '.github/workflows/luatools-native-ui2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui2:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout build bundle
        uses: actions/checkout@v4

      - name: Reassemble build kit and apply UI v2
        shell: bash
        run: |
          set -euxo pipefail
          cat luatools-bundle/part*.b64 | base64 -d > LuaTools-Native-1.3.3-Realization.tar.gz
          mkdir -p workkit
          tar -xzf LuaTools-Native-1.3.3-Realization.tar.gz -C workkit --strip-components=1

          # Carry forward the two native.1 integration fixes.
          sed -i "/# 2) Game-tools implementation reconstructed/a (P/'Services'/'GameData').mkdir(parents=True, exist_ok=True)" workkit/scripts/apply_overlay.py
          python - <<'PY'
          from pathlib import Path
          p=Path("workkit/scripts/apply_overlay.py")
          s=p.read_text()
          old="write(sam_service,s)"
          new="""s=s.replace("_coverCache.GetCoverPathOrUrl(game.Id)", '_coverCache.GetLocalPath(game.Id) ?? $"https://cdn.cloudflare.steamstatic.com/steam/apps/{game.Id}/header.jpg"')
          write(sam_service,s)"""
          if old not in s: raise SystemExit("SamService patch anchor missing")
          p.write_text(s.replace(old,new,1))
          PY

          # Append the native.2 visual parity pass. It runs after the functional 1.3.3 overlay
          # in the same source transformation process.
          cat luatools-ui2/ui2_append.pyfrag >> workkit/scripts/apply_overlay.py
          python -m py_compile workkit/scripts/apply_overlay.py
          bash -n workkit/scripts/build-appimage.sh

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build native.2 AppImage
        run: ./workkit/scripts/build-appimage.sh

      - name: Smoke-test UI under virtual X server
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick openbox xdotool
          APPIMAGE="$(find workkit/dist -maxdepth 1 -name '*.AppImage' -type f | head -n1)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"

          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          openbox >/tmp/openbox.log 2>&1 &
          WM_PID=$!
          sleep 2

          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" >/tmp/luatools-ui.log 2>&1 &
          APP_PID=$!

          WIN=""
          for i in $(seq 1 30); do
            WIN="$(xdotool search --name '^LuaTools$' 2>/dev/null | head -n1 || true)"
            [ -n "$WIN" ] && break
            sleep 1
          done
          test -n "$WIN"
          xdotool windowmap "$WIN" || true
          xdotool windowactivate --sync "$WIN" || true
          sleep 3
          xdotool getwindowgeometry --shell "$WIN" >/tmp/luatools-window.txt
          import -window "$WIN" workkit/dist/LuaTools-native.2-smoke.png
          test -s workkit/dist/LuaTools-native.2-smoke.png

          MEAN="$(identify -format '%[fx:mean]' workkit/dist/LuaTools-native.2-smoke.png)"
          python - "$MEAN" <<'PY'
          import sys
          mean=float(sys.argv[1])
          print(f"captured-window-mean={mean:.6f}")
          if mean <= 0.015:
              raise SystemExit("Captured LuaTools window is effectively black")
          PY

          echo "---- LuaTools window ----"
          cat /tmp/luatools-window.txt
          echo "---- LuaTools smoke log ----"
          cat /tmp/luatools-ui.log || true

          kill "$APP_PID" 2>/dev/null || true
          kill "$WM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Rename candidate
        shell: bash
        run: |
          set -euxo pipefail
          OLD="$(find workkit/dist -maxdepth 1 -name '*.AppImage' -type f | head -n1)"
          NEW="workkit/dist/LuaTools-1.3.3-native.2-x86_64.AppImage"
          if [ "$OLD" != "$NEW" ]; then mv "$OLD" "$NEW"; fi
          chmod +x "$NEW"
          sha256sum "$NEW" > "$NEW.sha256"

      - name: Upload native.2
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-1.3.3-native.2-x86_64
          path: |
            workkit/dist/LuaTools-1.3.3-native.2-x86_64.AppImage
            workkit/dist/LuaTools-1.3.3-native.2-x86_64.AppImage.sha256
            workkit/dist/LuaTools-native.2-smoke.png
          if-no-files-found: error
          retention-days: 30
