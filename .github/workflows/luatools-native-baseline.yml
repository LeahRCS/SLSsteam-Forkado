name: LuaTools Native AppImage Baseline

on:
  push:
    branches: [ "ci/luatools-native-1.3.3" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Linux Avalonia port
        uses: actions/checkout@v4
        with:
          repository: fitzypopper/LuaTools-linux
          ref: fe69b8c35fcae1b77f4775a58c34f99eba6cbf04
          path: source

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test source/tests/LuaToolsGui.Tests/LuaToolsGui.Tests.csproj -c Release

      - name: Publish self-contained Linux x64
        run: |
          dotnet publish source/src/LuaToolsGui/LuaToolsGui.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o "$GITHUB_WORKSPACE/publish"

      - name: Build AppDir
        shell: bash
        run: |
          set -euxo pipefail
          APPDIR="$GITHUB_WORKSPACE/LuaTools.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp -a "$GITHUB_WORKSPACE/publish/." "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/LuaTools"
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/LuaTools" "$@"
          SH
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/LuaTools.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LuaTools
          Comment=Steam manifest and library manager
          Exec=LuaTools %u
          Icon=luatools
          Terminal=false
          Categories=Game;Utility;
          MimeType=x-scheme-handler/luatools;
          DESKTOP
          cat > "$APPDIR/luatools.svg" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#32c6ff"/></linearGradient></defs>
            <rect width="256" height="256" rx="56" fill="#10141c"/>
            <path d="M70 55h38v108h78v38H70z" fill="url(#g)"/>
            <circle cx="178" cy="78" r="24" fill="none" stroke="#fff" stroke-width="12"/>
          </svg>
          SVG
          cp "$APPDIR/LuaTools.desktop" "$APPDIR/usr/share/applications/LuaTools.desktop"
          cp "$APPDIR/luatools.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/luatools.svg"
          ln -sfn luatools.svg "$APPDIR/.DirIcon"

      - name: Package AppImage
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$GITHUB_WORKSPACE/LuaTools.AppDir" \
            "$GITHUB_WORKSPACE/LuaTools-native-baseline-x86_64.AppImage"
          chmod +x "$GITHUB_WORKSPACE/LuaTools-native-baseline-x86_64.AppImage"
          sha256sum "$GITHUB_WORKSPACE/LuaTools-native-baseline-x86_64.AppImage" > "$GITHUB_WORKSPACE/LuaTools-native-baseline-x86_64.AppImage.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-native-baseline-x86_64
          path: |
            LuaTools-native-baseline-x86_64.AppImage
            LuaTools-native-baseline-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
